databases:
  - name: lardoce-db
    databaseName: lardocelar
    user: admin
    plan: free

services:
  - type: web
    name: lardoce-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lardoce-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
